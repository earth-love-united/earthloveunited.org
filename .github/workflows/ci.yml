            'dark legend copy must retain at least 4.5:1 worst-case contrast');
          assert(dockAudit.backLabelContained, '768x600 return label must remain inside its button');
          await page.click('[data-country-close]');
          await page.waitForFunction(() => !window.GlobeModule?._selectedCountryFeature);
          await page.setViewportSize({ width: 1280, height: 800 });

          const cspViolations = await page.evaluate(() => window.__ct45CspViolations || []);
          assert(cspViolations.length === 0, 'live globe must produce no CSP violations: ' + JSON.stringify(cspViolations));
          const smoke = await page.evaluate(async () => {
            try { return await window.SmokeTest.run(); }
            catch (e) { return { error: String(e) }; }
          });
          const stack = await page.evaluate(() => {
            try { return window.StackLint.audit(); }
            catch (e) { return { error: String(e) }; }
          });

          console.log('SmokeTest:', JSON.stringify(smoke, null, 2));
          console.log('StackLint:', JSON.stringify(stack, null, 2));
          console.log('Runtime lifecycle:', JSON.stringify(runtimeLifecycle, null, 2));

          await browser.close();

          const smokeShapeValid = smoke && typeof smoke === 'object' && !Array.isArray(smoke) &&
            Number.isInteger(smoke.passed) && Number.isInteger(smoke.failed) &&
            Number.isInteger(smoke.criticalFailed) && Array.isArray(smoke.results);
          const smokeFailed = !smokeShapeValid || smoke.error || smoke.failed !== 0 ||
            smoke.criticalFailed !== 0 || smoke.results.some(result => result?.pass !== true);
          const stackShapeValid = Array.isArray(stack);
          const stackFailed = !stackShapeValid || stack.some(result => result?.pass !== true);

          if (smokeFailed || stackFailed || consoleErrors.length) {
            console.error('❌ checks failed');
            consoleErrors.forEach(e => console.error('  ', e));
            process.exit(1);
          }
          console.log('✅ all checks passed');
          JS
          node runchecks.mjs
          rm -f runchecks.mjs package.json package-lock.json

      - name: Tear down server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then kill "$(cat /tmp/server.pid)" 2>/dev/null || true; fi
