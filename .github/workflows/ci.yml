# ═════════════════════════════════════════════════════════════════
#  CI — Earth Love United
# ═════════════════════════════════════════════════════════════════
#
#  Runs on every PR and every push to main. Four validation layers:
#
#    1. SDK static checks   (verify_load_order.py + node --check)
#    2. Climate truth       (stack-aware validators; strict for reviewed release)
#    3. Headless SmokeTest  (serve the site + run SmokeTest.run()
#                            in Playwright/Chromium)
#    4. StackLint audit     (z-index + invisible-blocker check)
#
#  Required by branch protection. PRs cannot merge until CI is green.
# ═════════════════════════════════════════════════════════════════

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: SDK static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: globe.gl vendor delivery policy
        run: node tools/check-globe-vendor-integrity.js

      - name: Verify NASA Black Marble source pin
        run: ./tools/authoring/fetch-nasa-black-marble.sh --check

      - name: CT-45 localized runtime asset policy
        run: node tools/check-globe-runtime-assets.js

      - name: Globe third-party notices integrity
        run: node tools/check-globe-third-party-notices.js

      - name: Globe runtime approval cryptographic policy
        run: node tools/check-globe-runtime-approval.js

      - name: Country Climate Intelligence release signature policy
        run: node tools/check-country-climate-intelligence-release-signatures.js

      - name: Final staged production integrity policy self-test
        run: node tools/check-staged-production-integrity.js --self-test

      - name: Public climate release-profile policy
        run: node tools/check-public-climate-release-profile.js --self-test

      - name: Detect active public climate release profile
        id: climate_profile
        run: |
          state="$(node tools/check-public-climate-release-profile.js --state)"
          case "$state" in
            cci:candidate) profile="cci"; phase="candidate" ;;
            cci:release) profile="cci"; phase="release" ;;
            legacy_ct40:candidate) profile="legacy_ct40"; phase="candidate" ;;
            legacy_ct40:release) profile="legacy_ct40"; phase="release" ;;
            *) echo "::error::Unknown or incomplete public climate release state: $state"; exit 1 ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"

      - name: Exact public deploy surface policy self-test
        run: node tools/check-public-deploy-surface.js --self-test

      - name: CCI AI-factual deploy policy self-test
        run: node tools/check-cci-factual-public-deploy.js --self-test

      - name: Country Climate Intelligence public-release exclusion policy
        run: node tools/check-country-climate-public-release-boundary.js --self-test

      - name: Factual-public readiness policy self-test
        run: node tools/check-climate-factual-public-readiness.js --self-test

      - name: Final staged factual-public integrity policy self-test
        run: node tools/check-staged-factual-public-integrity.js --self-test

      - name: Climate production readiness policy fixtures
        run: node tools/check-climate-production-readiness-policy.js

      - name: Verify script load-order DAG
        run: python3 scripts/verify_load_order.py

      - name: Country Climate Intelligence v1 candidate contract
        if: ${{ steps.climate_profile.outputs.profile == 'cci' && steps.climate_profile.outputs.phase == 'candidate' }}
        run: node tools/check-country-climate-intelligence-ci.js

      - name: Country Climate Intelligence multi-model AI review artifact
        if: ${{ steps.climate_profile.outputs.profile == 'cci' && steps.climate_profile.outputs.phase == 'candidate' }}
        run: node tools/check-cci-factual-public-review.js

      - name: Country Climate Intelligence v1 reviewed-release gate
        if: ${{ steps.climate_profile.outputs.profile == 'cci' && steps.climate_profile.outputs.phase == 'release' }}
        run: node tools/check-country-climate-intelligence-release-gate.js --require-release

      - name: Country Climate Intelligence WebGL fallback parity
        run: node tools/check-globe-webgl-fallback.js

      - name: Climate truth CI policy fixtures
        run: node tools/check-climate-truth-ci.js

      - name: CT-42 rollback review contract self-test
        run: node tools/check-ct42-runtime-rollback-review.js --self-test

      - name: CT-42 rollback review artifact
        if: ${{ hashFiles('data/climate/reviews/ct42-runtime-rollback-review.json') != '' }}
        run: node tools/check-ct42-runtime-rollback-review.js

      - name: Climate runtime diff boundary fixtures
        run: node tools/check-climate-runtime-diff-boundary.js --self-test

      - name: Climate runtime diff boundary
        env:
          CLIMATE_RUNTIME_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CLIMATE_RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/check-climate-runtime-diff-boundary.js --base "$CLIMATE_RUNTIME_BASE_SHA" --head "$CLIMATE_RUNTIME_HEAD_SHA"

      - name: Climate active-profile readiness
        run: node tools/check-public-climate-release-profile.js --verify-active

      - name: Climate truth CI (explicit partial stack)
        run: node tools/climate-truth-ci.js --allow-incomplete

      - name: Climate truth CI reviewed-release gate
        if: ${{ steps.climate_profile.outputs.phase == 'release' }}
        run: node tools/climate-truth-ci.js --strict

      - name: node --check on every JS file
        run: |
          set -e
          FAIL=0
          while IFS= read -r f; do
            if ! node --check "$f" 2>&1; then
              echo "::error file=$f::Syntax error"
              FAIL=1
            fi
          done < <(find js dis -name '*.js' -not -path '*/vendor/*')
          if [ "$FAIL" -eq 1 ]; then exit 1; fi

      - name: Pre-commit hook self-test
        run: |
          chmod +x tools/agent-precommit
          # Stage a no-op so the hook has something to scan
          git config user.email ci@example.com
          git config user.name CI
          # Run the hook directly without committing
          ./tools/agent-precommit || true   # informational on a clean tree

  factual_public:
    name: Factual-public deploy gates
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Detect active public climate release profile
        id: factual_profile
        run: |
          state="$(node tools/check-public-climate-release-profile.js --state)"
          case "$state" in
            cci:candidate) profile="cci"; phase="candidate" ;;
            cci:release) profile="cci"; phase="release" ;;
            legacy_ct40:candidate) profile="legacy_ct40"; phase="candidate" ;;
            legacy_ct40:release) profile="legacy_ct40"; phase="release" ;;
            *) echo "::error::Unknown or incomplete public climate release state: $state"; exit 1 ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"

      - name: Build CCI AI-reviewed source-data deploy directory
        if: ${{ steps.factual_profile.outputs.profile == 'cci' && steps.factual_profile.outputs.phase == 'candidate' }}
        run: ./tools/build-cci-factual-public-deploy.sh --cci-ai-factual

      - name: Build limited legacy factual-display deploy directory
        if: ${{ steps.factual_profile.outputs.profile == 'legacy_ct40' && steps.factual_profile.outputs.phase == 'candidate' }}
        run: ./tools/build-factual-public-deploy.sh --factual-public

      - name: Build reviewed legacy release deploy directory
        if: ${{ steps.factual_profile.outputs.profile == 'legacy_ct40' && steps.factual_profile.outputs.phase == 'release' }}
        run: ./tools/build-deploy.sh --release

      - name: Build reviewed CCI release deploy directory
        if: ${{ steps.factual_profile.outputs.profile == 'cci' && steps.factual_profile.outputs.phase == 'release' }}
        run: ./tools/build-deploy.sh --release

      - name: Verify factual-public exact surface independently
        if: ${{ steps.factual_profile.outputs.profile == 'legacy_ct40' || (steps.factual_profile.outputs.profile == 'cci' && steps.factual_profile.outputs.phase == 'release') }}
        run: node tools/check-public-deploy-surface.js --staged ./_deploy --mode release

      - name: Verify CCI AI-factual exact surface independently
        if: ${{ steps.factual_profile.outputs.profile == 'cci' && steps.factual_profile.outputs.phase == 'candidate' }}
        run: node tools/check-cci-factual-public-deploy.js --staged ./_deploy

      - name: Verify factual-public notices independently
        if: ${{ steps.factual_profile.outputs.profile == 'legacy_ct40' || steps.factual_profile.outputs.profile == 'cci' }}
        run: node tools/check-globe-third-party-notices.js --staged ./_deploy

      - name: Verify final CCI AI-factual integrity independently
        if: ${{ steps.factual_profile.outputs.profile == 'cci' && steps.factual_profile.outputs.phase == 'candidate' }}
        run: node tools/check-staged-cci-factual-public-integrity.js --staged ./_deploy

      - name: Verify final limited legacy factual-display integrity independently
        if: ${{ steps.factual_profile.outputs.profile == 'legacy_ct40' && steps.factual_profile.outputs.phase == 'candidate' }}
        run: node tools/check-staged-factual-public-integrity.js --staged ./_deploy

      - name: Verify final legacy release integrity independently
        if: ${{ steps.factual_profile.outputs.profile == 'legacy_ct40' && steps.factual_profile.outputs.phase == 'release' }}
        env:
          ELU_VERIFIED_DEPLOY_MODE: release
        run: node tools/check-staged-production-integrity.js --staged ./_deploy

      - name: Verify final CCI release integrity independently
        if: ${{ steps.factual_profile.outputs.profile == 'cci' && steps.factual_profile.outputs.phase == 'release' }}
        env:
          ELU_VERIFIED_DEPLOY_MODE: release
        run: node tools/check-staged-production-integrity.js --staged ./_deploy

  smoke:
    name: Headless SmokeTest + StackLint
    runs-on: ubuntu-latest
    needs: [static, factual_public]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Detect active public climate release profile
        id: smoke_profile
        run: |
          state="$(node tools/check-public-climate-release-profile.js --state)"
          case "$state" in
            cci:candidate) profile="cci"; phase="candidate" ;;
            cci:release) profile="cci"; phase="release" ;;
            legacy_ct40:candidate) profile="legacy_ct40"; phase="candidate" ;;
            legacy_ct40:release) profile="legacy_ct40"; phase="release" ;;
            *) echo "::error::Unknown or incomplete public climate release state: $state"; exit 1 ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          if [ "$profile:$phase" = "cci:candidate" ]; then
            echo "integrity_mode=cci-ai-factual" >> "$GITHUB_OUTPUT"
          else
            echo "integrity_mode=$phase" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch verified globe.gl runtime dependency
        run: ./tools/fetch-globe-vendor.sh

      - name: Verify browser-test dependency bytes
        run: node tools/check-globe-vendor-integrity.js --require-file

      - name: Build legacy candidate deploy directory
        if: ${{ steps.smoke_profile.outputs.profile == 'legacy_ct40' && steps.smoke_profile.outputs.phase == 'candidate' }}
        run: ./tools/build-deploy.sh --candidate

      - name: Build CCI AI-reviewed source-data browser deploy directory
        if: ${{ steps.smoke_profile.outputs.profile == 'cci' && steps.smoke_profile.outputs.phase == 'candidate' }}
        run: ./tools/build-cci-factual-public-deploy.sh --cci-ai-factual

      - name: Build reviewed release deploy directory
        if: ${{ steps.smoke_profile.outputs.phase == 'release' }}
        run: ./tools/build-deploy.sh --release

      - name: Verify exact public deploy surface independently
        if: ${{ steps.smoke_profile.outputs.profile == 'legacy_ct40' && steps.smoke_profile.outputs.phase == 'candidate' }}
        run: node tools/check-public-deploy-surface.js --staged _deploy --mode candidate

      - name: Verify CCI AI-factual deploy surface independently
        if: ${{ steps.smoke_profile.outputs.profile == 'cci' && steps.smoke_profile.outputs.phase == 'candidate' }}
        run: node tools/check-cci-factual-public-deploy.js --staged _deploy

      - name: Verify release public deploy surface independently
        if: ${{ steps.smoke_profile.outputs.phase == 'release' }}
        run: node tools/check-public-deploy-surface.js --staged _deploy --mode release

      - name: Verify staged third-party notices independently
        run: node tools/check-globe-third-party-notices.js --staged _deploy

      - name: Verify staged CT-45 bytes independently
        if: ${{ steps.smoke_profile.outputs.profile != 'cci' || steps.smoke_profile.outputs.phase != 'candidate' }}
        run: node tools/check-globe-runtime-assets.js --staged _deploy

      - name: Verify final staged production integrity independently
        env:
          ELU_VERIFIED_DEPLOY_MODE: ${{ steps.smoke_profile.outputs.integrity_mode }}
        run: node tools/check-staged-production-integrity.js --staged _deploy

      - name: Verify final staged CCI AI-factual integrity independently
        if: ${{ steps.smoke_profile.outputs.profile == 'cci' && steps.smoke_profile.outputs.phase == 'candidate' }}
        run: node tools/check-staged-cci-factual-public-integrity.js --staged _deploy

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.59.1
          npx playwright install chromium --with-deps

      - name: Serve static site in background
        run: |
          cd _deploy
          python3 -m http.server 8000 &
          echo $! > /tmp/server.pid
          # wait until reachable
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/ >/dev/null && break
            sleep 0.5
          done

      - name: Run SmokeTest + StackLint in headless Chromium
        env:
          CCI_AI_FACTUAL: ${{ steps.smoke_profile.outputs.profile == 'cci' && steps.smoke_profile.outputs.phase == 'candidate' }}
        run: |
          cat > runchecks.mjs <<'JS'
          import { chromium } from 'playwright';
          const aiFactual = process.env.CCI_AI_FACTUAL === 'true';
          const browser = await chromium.launch();
          const ctx = await browser.newContext({ serviceWorkers: 'block', viewport: { width: 1280, height: 800 } });
          await ctx.addInitScript(() => {
            window.__ct45CspViolations = [];
            document.addEventListener('securitypolicyviolation', event => {
              window.__ct45CspViolations.push({
                blockedURI: event.blockedURI,
                directive: event.effectiveDirective,
              });
            });
          });
          const page = await ctx.newPage();
          const cdp = await ctx.newCDPSession(page);
          await page.addInitScript(() => {
            try { localStorage.setItem('elu-theme', 'dark'); } catch {}
          });

          const consoleErrors = [];
          const trackErrors = (target, options = {}) => {
            target.on('pageerror', e => consoleErrors.push('pageerror: ' + e.message));
            target.on('console', m => {
              if (m.type() === 'error' && !/Failed to load resource/.test(m.text())) {
                if (options.expectedConsoleError?.test(m.text())) options.expectedMatches += 1;
                else consoleErrors.push('console.error: ' + m.text());
              }
            });
          };
          trackErrors(page);
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const waitForApp = target => target.waitForFunction(
            () => window.App && window.GlobeModule && window.Data && window.COUNTRY_CLIMATE_INTELLIGENCE &&
              ['ready', 'unavailable'].includes(window.Data.climateIntelligenceState),
            null,
            { timeout: 15000 }
          );
          const waitForLiveGlobe = target => target.waitForFunction(() => {
            const state = window.GlobeModule?.getState?.();
            return window.GlobeModule?._initialized === true && state?.runtimeAssetsPrepared === true &&
              state?.countryFeatureCount === 201 && state?.countryDeckCount === 201 && state?.rendererCanvasCount === 1;
          }, null, { timeout: 30000 });
          const liveSnapshot = target => target.evaluate(() => window.GlobeModule.getState());

          async function exercisePreRenderFailure(urlPattern, expectedReason, response, expectedConsoleError = null) {
            const target = await ctx.newPage();
            const expectedCapture = { expectedConsoleError, expectedMatches: 0 };
            trackErrors(target, expectedCapture);
            const handler = route => route.fulfill(response);
            await target.route(urlPattern, handler);
            await target.goto('http://localhost:8000/', { waitUntil: 'networkidle', timeout: 30000 });
            await waitForApp(target);
            const started = await target.evaluate(() => window.App.enterGlobe());
            assert(started === false, expectedReason + ' must prevent renderer startup');
            await target.waitForFunction(reason => window.GlobeModule?._fallbackReasonCode === reason, expectedReason);
            const failed = await liveSnapshot(target);
            assert(failed.rendererCanvasCount === 0, expectedReason + ' must have zero canvases');
            assert(await target.evaluate(() => window.GlobeModule._initialized === false), expectedReason + ' must remain uninitialized');
            await target.unroute(urlPattern, handler);
            const retried = await target.evaluate(() => window.App.retryGlobe());
            assert(retried === true, expectedReason + ' retry must recover');
            await waitForLiveGlobe(target);
            const recovered = await liveSnapshot(target);
            assert(recovered.rendererCanvasCount === 1 && recovered.countryDeckCount === 201, expectedReason + ' retry must create exactly one renderer');
            if (expectedConsoleError) assert(expectedCapture.expectedMatches >= 1, expectedReason + ' must emit its exact visible data-boundary error');
            await target.close();
          }

          async function exercisePreRenderTimeout(urlPattern, expectedReason) {
            const target = await ctx.newPage();
            trackErrors(target);
            const handler = async route => {
              await new Promise(resolve => setTimeout(resolve, 9000));
              await route.abort('timedout').catch(() => undefined);
            };
            await target.route(urlPattern, handler);
            await target.goto('http://localhost:8000/', { waitUntil: 'networkidle', timeout: 30000 });
            await waitForApp(target);
            const started = await target.evaluate(() => window.App.enterGlobe());
            assert(started === false, expectedReason + ' timeout must prevent renderer startup');
            await target.waitForFunction(reason => window.GlobeModule?._fallbackReasonCode === reason, expectedReason, { timeout: 15000 });
            const failed = await liveSnapshot(target);
            assert(failed.rendererCanvasCount === 0, expectedReason + ' timeout must have zero canvases');
            assert(await target.evaluate(() => window.GlobeModule._initialized === false), expectedReason + ' timeout must remain uninitialized');
            await target.unroute(urlPattern, handler);
            const retried = await target.evaluate(() => window.App.retryGlobe());
            assert(retried === true, expectedReason + ' timeout retry must recover');
            await waitForLiveGlobe(target);
            assert((await liveSnapshot(target)).rendererCanvasCount === 1, expectedReason + ' timeout retry must create exactly one renderer');
            await target.close();
          }

          async function exerciseSlowClimateRuntimeFirstVisit() {
            const target = await ctx.newPage();
            trackErrors(target);
            let requestCount = 0;
            const startedAt = Date.now();
            const appHandler = async route => {
              await new Promise(resolve => setTimeout(resolve, 1500));
              await route.continue();
            };
            const handler = async route => {
              requestCount += 1;
              const response = await route.fetch();
              await new Promise(resolve => setTimeout(resolve, 8500));
              await route.fulfill({ response });
            };
            await target.route('**/js/app.js*', appHandler);
            await target.route('**/data/climate/runtime/country-climate-intelligence.json*', handler);
            await target.goto('http://localhost:8000/', { waitUntil: 'commit', timeout: 30000 });
            const firstPaintAction = target.locator('.enter-btn[data-action="enterGlobe"]');
            await firstPaintAction.waitFor({ state: 'visible', timeout: 5000 });
            await firstPaintAction.click();
            const earlyState = await target.evaluate(() => ({
              appBound: window.App?._staticActionsBound === true,
              pending: window.__ELU_EARLY_GLOBE__?.pending === true,
              disabled: document.querySelector('.enter-btn')?.disabled === true,
              busy: document.querySelector('.enter-btn')?.getAttribute('aria-busy'),
              status: document.getElementById('app-readiness-status')?.textContent || '',
              globeMode: document.body.classList.contains('globe-mode'),
            }));
            assert(!earlyState.appBound && earlyState.pending && earlyState.disabled && earlyState.busy === 'true' &&
              earlyState.status.includes('Loading verified country evidence') && !earlyState.globeMode,
              'the first-paint globe action must acknowledge and queue before the deferred App runtime binds');
            await target.waitForFunction(() => window.App?._staticActionsBound === true, null, { timeout: 10000 });
            const boundState = await target.evaluate(() => ({
              pending: window.__ELU_EARLY_GLOBE__?.pending === true,
              disabled: document.querySelector('.enter-btn')?.disabled === true,
              busy: document.querySelector('.enter-btn')?.getAttribute('aria-busy'),
              state: window.Data?.climateIntelligenceState,
              globeMode: document.body.classList.contains('globe-mode'),
            }));
            assert(!boundState.pending && boundState.disabled && boundState.busy === 'true' &&
              boundState.state === 'loading' && !boundState.globeMode,
              'App must consume the queued action but keep the hero stable while exact-SHA evidence loads');
            await waitForApp(target);
            const snapshot = await target.evaluate(() => ({
              ready: window.Data.isClimateIntelligenceReady(),
              entities: window.Data.getClimateIntelligenceRelease()?.countries?.length || 0,
              state: window.Data.climateIntelligenceState,
              fallback: document.body.classList.contains('globe-fallback-active'),
              buttonBusy: document.querySelector('.enter-btn')?.getAttribute('aria-busy'),
            }));
            assert(Date.now() - startedAt >= 8400, 'slow-runtime regression must hold the first response beyond the retired eight-second deadline');
            assert(requestCount === 1 && snapshot.ready && snapshot.entities === 249 && snapshot.state === 'ready' && !snapshot.fallback,
              'an 8.5-second first CCI response must retain all 249 entities without entering fallback');
            await waitForLiveGlobe(target);
            assert(await target.evaluate(() => document.querySelector('.enter-btn')?.getAttribute('aria-busy') === null),
              'the consumed first-paint action must clear its busy state after renderer readiness');
            await target.unroute('**/js/app.js*', appHandler);
            await target.unroute('**/data/climate/runtime/country-climate-intelligence.json*', handler);
            await target.close();
          }

          async function exerciseGlobeStylesFailure() {
            const target = await ctx.newPage();
            trackErrors(target);
            const handler = route => route.abort('failed');
            await target.route('**/css/globe-system.css*', handler);
            await target.goto('http://localhost:8000/', { waitUntil: 'networkidle', timeout: 30000 });
            await waitForApp(target);
            assert(await target.evaluate(() => window.App.enterGlobe()) === false,
              'missing globe CSS must refuse globe-mode activation');
            const snapshot = await target.evaluate(() => ({
              globeMode: document.body.classList.contains('globe-mode'),
              styleState: document.documentElement.dataset.globeStylesReady,
              status: document.getElementById('app-readiness-status')?.textContent || '',
              exposed: [
                '#climate-lens-controls', '#hex-legend', '#elu-country-rank-rail',
                '#elu-country-card-wrap', '#guided-orbit-replay', '#globe-loading',
                '#globe-fallback', '#globe-back-btn',
              ].filter(selector => {
                const element = document.querySelector(selector);
                return element && getComputedStyle(element).display !== 'none';
              }),
            }));
            assert(!snapshot.globeMode && snapshot.styleState === 'error' && snapshot.exposed.length === 0 &&
              snapshot.status.includes('could not be prepared'),
              'failed deferred globe CSS must keep every HUD surface hidden and announce retry readiness');
            await target.unroute('**/css/globe-system.css*', handler);
            await target.close();
          }

          async function exerciseServiceWorkerUpgradeOffline() {
            const swContext = await browser.newContext({ serviceWorkers: 'allow', viewport: { width: 412, height: 823 } });
            const target = await swContext.newPage();
            const expectedCache = aiFactual ? 'elu-v80-cci-factual-ai-review' : 'elu-v78-first-paint-ready';
            const expectedEpoch = aiFactual ? 'v=80-cci-factual-ai-review' : 'v=78-first-paint-ready';
            await target.goto('http://localhost:8000/', { waitUntil: 'networkidle', timeout: 30000 });
            await target.waitForFunction(() => navigator.serviceWorker.controller, null, { timeout: 30000 });
            await waitForApp(target);
            const online = await target.evaluate(async () => ({
              cacheKeys: await caches.keys(),
