<!DOCTYPE html>

<title>Page Not Found | Earth Love United</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html{color-scheme:dark}
  body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#050509;color:#e2dfd8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{width:min(680px,100%);padding:clamp(32px,7vw,72px);border:1px solid rgba(78,205,196,.24);border-radius:16px;background:rgba(255,255,255,.035);box-shadow:0 24px 80px rgba(0,0,0,.35);text-align:center}

  h1{margin:0;color:#e2dfd8;font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,8vw,68px);font-weight:400;line-height:1.05}
  p{max-width:48ch;margin:22px auto 0;color:#9a9590;font-size:17px;line-height:1.65}
  nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:34px}
  nav a{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border:1px solid rgba(78,205,196,.35);border-radius:4px;color:#7be8d0;text-decoration:none}
  nav a:hover,nav a:focus-visible{background:rgba(78,205,196,.1);outline:2px solid #7be8d0;outline-offset:3px}
</style>
</head>
<body>
<main>
  <a class="brand" href="/">Earth Love United</a>

  <nav aria-label="Page not found options">
    <a href="/">Return to the Foundation</a>
    <a href="/#globe">Explore the Living Globe</a>
  </nav>
</main>
